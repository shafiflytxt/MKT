openapi: 3.0.3

info:
  title: NEON-dX MKT Inbound Integration API
  version: "1.0.0"
  description: |
    ## Overview
    This API specification covers the **NEON-dX Inbound Integration REST APIs** for MKT,
    specifically the **Get Offers (v2)** and **Accept Offer** APIs.

    The integration enables MKT inbound touchpoints to:
    - Retrieve personalized, rich media offers from the NEON-DX recommendation engine.
    - Notify NEON-DX when a customer accepts an offer, triggering downstream conversion and fulfilment events.

    ## Authentication
    All API requests require **two layers of authentication**:
    1. **Basic Auth** — Pass `Authorization: Basic <base64(username:password)>` in the HTTP header.
    2. **Auth Key** — A per-channel authentication key embedded in the URL path as `/rest/authkey/<authKey>/`.

    Both must be present for every request. The auth key is validated per request with IP whitelisting on the NEON-DX API gateway.

    ## URL Format
    ```
    <PROTOCOL>://<IP_ADDRESS>:<CONNECTOR_PORT>/rest/authkey/<authKey>/<APIspecificString>?[Parameters]
    ```

    ## Supported Formats
    Requests and responses are supported in **JSON** (default) and **XML** formats.
    Specify the `Accept` header to control the format:
    - `application/json` (default)
    - `application/xml`

    ## Channel Auth Keys
    | Channel Name   | Auth Key (Production)          |
    |----------------|-------------------------------|
    | APP            | `<Will be provided by Flytxt>` |
    | CRM / Maxis    | `<Will be provided by Flytxt>` |
    | OneCC          | `<Will be provided by Flytxt>` |
    | Online Shop    | `<Will be provided by Flytxt>` |

    ## Document Reference
    - **Document Title:** Inbound Integration Design in NEON-DX for MKT
    - **Version:** V1.0  |  **Status:** Review  |  **Date:** 06-03-2026
    - **Author:** Shafi Kodidala (Flytxt)
servers:
  - url: "https://{host}:{port}/rest/authkey/{authKey}"
    description: Production HTTPS Endpoint
    variables:
      host:
        default: "neon-dx-prod.example.com"
        description: NEON-DX API server hostname or IP address
      port:
        default: "443"
        description: API connector port number
      authKey:
        default: "bestOfferussd"
        description: >
          Authentication key issued by NEON-DX admin for each MKT channel/touchpoint.
          Example values: bestOfferussd, NEON_UI. This key is validated with IP whitelisting.

  - url: "http://{host}:{port}/rest/authkey/{authKey}"
    description: Non-Production / SIT HTTP Endpoint
    variables:
      host:
        default: "neon-dx-sit.example.com"
        description: NEON-DX SIT server hostname or IP address
      port:
        default: "8080"
        description: API connector port number
      authKey:
        default: "bestOfferussd"
        description: Auth key for SIT environment (separate from production)

# ─────────────────────────────────────────────────────────────────────────────
# Security Schemes
# ─────────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: >
        HTTP Basic Authentication. Encode `username:password` in Base64 and
        pass as `Authorization: Basic <encoded>`.
        Example: `Authorization: Basic YXBpdXNlcjphcGlwYXNzd29yZA==`

  # ─────────────────────────────────────────────────────────────────────────
  # Reusable Schemas
  # ─────────────────────────────────────────────────────────────────────────
  schemas:

    # ── Common ────────────────────────────────────────────────────────────
    StatusObject:
      type: object
      description: Top-level response status returned by all API operations.
      properties:
        code:
          type: integer
          description: >
            HTTP-aligned status code.
            - 200: Success
            - 205: No Offers Available (Get Offers only)
            - 400: Bad Request
            - 401: Authentication Failed
            - 404: Invalid MSISDN / Resource Not Found
            - 499: Failed
            - 500: Internal Server Error

          example: 200
        message:
          type: string
          description: Human-readable description corresponding to the status code.
          example: "Success"
      required:
        - code
        - message

    # ── Get Offers Response ───────────────────────────────────────────────
    SubAttribute:
      type: object
      description: >
        A nested key-value pair used within productAttributes or offerAttributes
        to represent structured benefit details (e.g., usage_leg, type, value).
      properties:
        name:
          type: string
          description: Name of the sub-attribute.
          example: "usage_leg"
        value:
          type: string
          description: Value of the sub-attribute.
          example: "Local voice"
      required:
        - name
        - value

    Attribute:
      type: object
      description: >
        A dynamic key-value attribute with optional nested sub-attributes.
        Used in both offerAttributes and productAttributes.
        New attributes can be added at runtime by business without code change.
      properties:
        attributeName:
          type: string
          description: Name of the attribute (e.g., "Bundle ID", "price", "validity").
          example: "Bundle ID"
        value:
          type: string
          description: Value of the attribute.
          example: "1195"
        subAttributes:
          type: array
          description: Nested sub-attributes; mostly empty except for "benefit" attribute.
          items:
            $ref: '#/components/schemas/SubAttribute'
          example: []
      required:
        - attributeName
        - value
        - subAttributes

    Action:
      type: object
      description: >
        A call-to-action element rendered alongside a rich media creative.
        NEON-DX supports a maximum of 3 actions per creative.
      properties:
        label:
          type: string
          description: Display label for the action button or link shown to the customer.
          example: "More Info"
        url:
          type: string
          format: uri
          description: Hyperlink URL the customer is taken to when clicking the action.
          example: "https://www.exampleTelecom.com/products/data/d87876547"
      required:
        - label
        - url

    Creative:
      type: object
      description: >
        Customer-facing display content for an offer. Supports two types:
        - `text`: Title + description text only (no mediaUrl).
        - `image`: Title + description + mediaUrl (rich media) + optional actions.
        Multiple language variants can be returned per offer.
      properties:
        language:
          type: string
          description: Language of the creative content.
          example: "English (UK)"
        isCustomerPreferred:
          type: string
          description: Whether this language matches the customer's preferred language. Values are "Yes" or "No".
          enum: ["Yes", "No"]
          example: "No"
        isDefault:
          type: boolean
          description: Indicates whether this is the default creative to display.
          example: true
        type:
          type: string
          description: >
            Format of the creative content.
            - `text`: Plain text title + description; no mediaUrl present.
            - `image`: Rich media with mediaUrl + optional actions array.
          enum: ["text", "image"]
          example: "text"
        title:
          type: string
          description: Short display title for the offer shown to the customer.
          example: "3000F = 24Go+300mn-30j"
        description:
          type: string
          description: Full offer description displayed to the customer.
          example: "24Go + 300mn ts reseaux valable 30j a 3000F"
        mediaUrl:
          type: string
          format: uri
          description: >
            URL of the rich media image or creative asset.
            **Present only when type = "image".**
          example: "https://www.exampleTelecom.com/images/mobileData3.jpeg"
        actions:
          type: array
          description: >
            Array of action buttons/links to render with the creative.
            **Present only when type = "image".**
            Maximum 3 actions are supported.
          maxItems: 3
          items:
            $ref: '#/components/schemas/Action'
      required:
        - language
        - isCustomerPreferred
        - isDefault
        - type
        - title
        - description

    Product:
      type: object
      description: A product item included within an offer.
      properties:
        productName:
          type: string
          description: Name of the product.
          example: "Promo_Illimax_3000F"
        productId:
          type: string
          description: Unique product identifier.
          example: "1135"
        productDescription:
          type: string
          description: Description of the product.
          example: "Promo_Illimax_3000F"
        productAttributes:
          type: array
          description: >
            Dynamic list of product attributes (e.g., price, validity, scope, benefit).
            The "benefit" attribute contains nested subAttributes (usage_leg, type, value).
          items:
            $ref: '#/components/schemas/Attribute'
          example:
            - attributeName: "price"
              value: "3000"
              subAttributes: []
            - attributeName: "validity"
              value: "30"
              subAttributes: []
            - attributeName: "servicetax"
              value: "0"
              subAttributes: []
            - attributeName: "scope"
              value: "Open Market"
              subAttributes: []
            - attributeName: "benefitDesc"
              value: "Promo_Illimax_3000F"
              subAttributes: []
            - attributeName: "ProductID"
              value: "65458"
              subAttributes: []
            - attributeName: "catgeory"
              value: "stv"
              subAttributes: []
            - attributeName: "processingfee"
              value: "0"
              subAttributes: []
            - attributeName: "benefit"
              value: ""
              subAttributes:
                - name: "usage_leg"
                  value: "Local voice"
                - name: "type"
                  value: "Minutes"
                - name: "value"
                  value: "\"100\""
      required:
        - productName
        - productId
        - productDescription
        - productAttributes

    OfferDetails:
      type: object
      description: Detailed information about a single offer including attributes, products, and creatives.
      properties:
        offerName:
          type: string
          description: Name of the offer as configured in NEON-DX.
          example: "Promo_Illimax_3000F_mandatory"
        offerInternalId:
          type: integer
          description: Internal system identifier for the offer.
          example: 2065
        offerType:
          type: string
          description: Category/type of the offer (e.g., stv, recharge, informational).
          example: "stv"
        offerAttributes:
          type: array
          description: >
            Dynamic offer-level attributes. Business can define new attributes
            without any code change at NEON-dX.
            Current MKT attributes:
            - Bundle ID (string): Unique ID of the bundle/package/addon.
            - category (string): Offer category.
            - Price (number): Price of the bundle/package/addon.
          items:
            $ref: '#/components/schemas/Attribute'
          example:
            - attributeName: "Bundle ID"
              value: "1195"
              subAttributes: []
            - attributeName: "Price"
              value: "3000"
              subAttributes: []
        products:
          type: array
          description: List of product items included under this offer.
          items:
            $ref: '#/components/schemas/Product'
        creatives:
          type: array
          description: >
            Display content variants for the offer (one or more language variants).
            May be text-only or rich media (image + actions).
          items:
            $ref: '#/components/schemas/Creative'
      required:
        - offerName
        - offerInternalId
        - offerType
        - offerAttributes
        - products
        - creatives

    Offer:
      type: object
      description: A single personalized offer returned by the Get Offers v2 API.
      properties:
        position:
          type: integer
          description: >
            Ranking/ordering of the offer in the response list.
            Lower number = higher priority recommendation.
          example: 1
        id:
          type: integer
          description: Unique offer identifier in NEON-DX.
          example: 1229
        ruleName:
          type: string
          description: Name of the recommendation rule that generated this offer.
          example: "ROS_Promo_Illimax_3000F_Mandatory_3_Local_Inbound_V2"
        programId:
          type: integer
          description: Identifier of the NEON-DX program associated with this offer.
          example: 1009
        programName:
          type: string
          description: Name of the NEON-DX program under which the offer was created.
          example: "NBO_Inbound_Program_Mandatory Offer"
        offerDetails:
          $ref: '#/components/schemas/OfferDetails'
      required:
        - position
        - id
        - ruleName
        - programId
        - programName
        - offerDetails

    GetOffersSuccessResponse:
      type: object
      description: Successful response from the Get Offers v2 API containing ranked offers.
      properties:
        status:
          $ref: '#/components/schemas/StatusObject'
        Offers:
          type: array
          description: Ordered list of personalized offers for the customer on the touchpoint.
          items:
            $ref: '#/components/schemas/Offer'
      required:
        - status
        - Offers
      example:
        status:
          code: 200
          message: "Success"
        Offers:
          - position: 1
            id: 1229
            ruleName: "ROS_Promo_Illimax_3000F_Mandatory_3_Local_Inbound_V2"
            programId: 1009
            programName: "NBO_Inbound_Program_Mandatory Offer"
            offerDetails:
              offerName: "Promo_Illimax_3000F_mandatory"
              offerInternalId: 2065
              offerType: "stv"
              offerAttributes:
                - attributeName: "Bundle ID"
                  value: "1195"
                  subAttributes: []
                - attributeName: "Price"
                  value: "3000"
                  subAttributes: []
              products:
                - productName: "Promo_Illimax_3000F"
                  productId: "1135"
                  productDescription: "Promo_Illimax_3000F"
                  productAttributes:
                    - attributeName: "price"
                      value: "3000"
                      subAttributes: []
                    - attributeName: "validity"
                      value: "30"
                      subAttributes: []
                    - attributeName: "benefit"
                      value: ""
                      subAttributes:
                        - name: "usage_leg"
                          value: "Local voice"
                        - name: "type"
                          value: "Minutes"
                        - name: "value"
                          value: "\"100\""
              creatives:
                - language: "English (UK)"
                  isCustomerPreferred: "No"
                  isDefault: true
                  type: "image"
                  title: "3000F = 24Go+300mn-30j"
                  description: "24Go + 300mn ts reseaux valable 30j a 3000F"
                  mediaUrl: "https://www.exampleTelecom.com/images/mobileData3.jpeg"
                  actions:
                    - label: "More Info"
                      url: "https://www.exampleTelecom.com/products/data/d87876547"

    GetOffersNoOffersResponse:
      type: object
      description: Response when no eligible offers are available for the customer.
      properties:
        status:
          $ref: '#/components/schemas/StatusObject'
      example:
        status:
          code: 205
          message: "No offers are available"

    # ── Accept Offer Request ──────────────────────────────────────────────
    EventItem:
      type: object
      description: >
        A single event record submitted to NEON-DX to register a customer interaction.
        For the Offer Accepted event, use event id = 104.
      properties:
        id:
          type: string
          description: >
            Event identifier. Use **"104"** for the Offer Accepted event.
            This triggers the conversion and fulfilment event chain in NEON-DX.
          example: "104"
        type:
          type: string
          description: >
            Type of event / touchpoint name where the acceptance occurred.
            Examples: WEB, APP, IVR, USSD, CRM, USSD, OneCC, OnlineShop.
          example: "WEB"
        value:
          type: string
          description: >
            Comma-separated values in the format: `<offerId>[,<Agent>,<Remarks>]`.
            - **offerId** (Mandatory): The `id` field from the Get Offers response.
            - **Agent** (Optional): Name of the agent who assisted the customer.
            - **Remarks** (Optional): Free-text remarks about the acceptance.
            Domain1 is reserved as a system field.
          example: "16279,AgentName,Accepted"
        date:
          type: string
          description: >
            Date and time the acceptance event occurred.
            **Format:** `yyyy-MM-dd HH:mm:ss Z` (ISO 8601 with timezone offset).
          pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} [+-]\d{4}$'
          example: "2026-03-12 10:30:00 +0530"
      required:
        - id
        - type
        - value
        - date

    AcceptOfferRequest:
      type: object
      description: Request payload for the Accept Offer API. Wraps one or more event items.
      properties:
        event:
          type: array
          description: Array of event objects. Typically contains one Offer Accepted event (id=104).
          items:
            $ref: '#/components/schemas/EventItem'
          minItems: 1
      required:
        - event
      example:
        event:
          - id: "104"
            type: "WEB"
            value: "16279,AgentName,Accepted"
            date: "2026-03-12 10:30:00 +0530"

    # ── Common Error Responses ────────────────────────────────────────────
    ErrorResponse:
      type: object
      description: Standard error response returned when an API call fails.
      properties:
        status:
          $ref: '#/components/schemas/StatusObject'
      example:
        status:
          code: 400
          message: "Bad Request"

  # ─────────────────────────────────────────────────────────────────────────
  # Reusable Parameters
  # ─────────────────────────────────────────────────────────────────────────
  parameters:

    MsisdnPath:
      name: msisdn
      in: path
      required: true
      description: >
        Customer's mobile subscriber number (MSISDN) used as the primary identity.
        Must be a valid numeric MSISDN present in NEON-DX.
        Example: `9812000012`
      schema:
        type: string
        pattern: '^\d{7,15}$'
      example: "9812000012"

    IdentityAttributeNamePath:
      name: identityAttributeName
      in: path
      required: true
      description: >
        Name of the identity attribute used instead of MSISDN.
        Example: `app_ID`
      schema:
        type: string
      example: "app_ID"

    IdentityAttributeValuePath:
      name: identityAttributeValue
      in: path
      required: true
      description: >
        Value of the identity attribute for the customer.
        Example: `xfgt56tra7685`
      schema:
        type: string
      example: "xfgt56tra7685"

    CategoryQuery:
      name: category
      in: query
      required: false
      description: >
        Filter offers by offer category name.
        Only offers belonging to this category will be returned.
      schema:
        type: string
      example: "Data"

    SubCategoryQuery:
      name: sub-category
      in: query
      required: false
      description: >
        Filter offers by offer sub-category name.
        Applied in conjunction with the `category` filter.
      schema:
        type: string
      example: "Daily"

    SizeQuery:
      name: size
      in: query
      required: false
      description: >
        Maximum number of offers to return in the response.
        If not specified, the system default is used.
      schema:
        type: integer
        minimum: 1
      example: 5

    EventArchivingQuery:
      name: eventArchiving
      in: query
      required: false
      description: >
        Controls whether an **Offer Recommendation event** is created for the returned offers.
        - `true` (default): An Offer Recommendation event is recorded in NEON-DX.
        - `false`: Suppresses event creation (use for test/debug calls).
      schema:
        type: boolean
        default: true
      example: true

    # ── Offer Attribute Filter Parameters ──
    OfferAttributeFilter:
      name: "offer.{attribute}"
      in: query
      required: false
      description: >
        Filter offers by a **dynamic offer attribute**. Prefix the attribute name with `offer.`.

        **Supported offer attributes for MKT:**
        | Attribute Name | Data Type | Description |
        |----------------|-----------|-------------|
        | `offer.BundleID` | string | Unique bundle/package/addon ID |
        | `offer.category` | string | Offer category |
        | `offer.Price` | number | Price of the bundle/package/addon |

        **Examples:**
        - `offer.Price=90` → returns offers with price = 90 (default EQ operation)
        - `offer.Price=90&offer.Price.operation=GT` → offers with price > 90
        - `offer.category=Data` → offers in Data category

        **Note:** Combine with `offer.{attribute}.operation` for non-equality comparisons.
      schema:
        type: string
      example: "90"

    OfferAttributeOperation:
      name: "offer.{attribute}.operation"
      in: query
      required: false
      description: >
        Comparison operator for the `offer.{attribute}` filter. Default is `EQ`.

        | Operation | Description | Example |
        |-----------|-------------|---------|
        | `EQ` | Equal to (default) | `offer.Price=90` or `offer.Price=90&offer.Price.operation=EQ` |
        | `LT` | Less than | `offer.Price=90&offer.Price.operation=LT` |
        | `LE` | Less than or equal to | `offer.Price=90&offer.Price.operation=LE` |
        | `GT` | Greater than | `offer.Price=90&offer.Price.operation=GT` |
        | `GE` | Greater than or equal to | `offer.Price=90&offer.Price.operation=GE` |
        | `BT` | Between (numeric only) — requires `lowval` and `highval` | `offer.Price.lowval=10&offer.Price.highval=100&offer.Price.operation=BT` |
        | `ANYOF` | Case-sensitive match with any of multiple values | `offer.Price=90&offer.Price=100&offer.Price.operation=ANYOF` |
      schema:
        type: string
        enum: [EQ, LT, LE, GT, GE, BT, ANYOF]
        default: EQ
      example: "EQ"

    OfferAttributeLowval:
      name: "offer.{attribute}.lowval"
      in: query
      required: false
      description: >
        Lower bound value for the `BT` (Between) operation on a numeric offer attribute.
        Must be used together with `offer.{attribute}.highval` and `offer.{attribute}.operation=BT`.

        **Example:** `offer.Price.lowval=10&offer.Price.highval=100&offer.Price.operation=BT`
      schema:
        type: number
      example: 10

    OfferAttributeHighval:
      name: "offer.{attribute}.highval"
      in: query
      required: false
      description: >
        Upper bound value for the `BT` (Between) operation on a numeric offer attribute.
        Must be used together with `offer.{attribute}.lowval` and `offer.{attribute}.operation=BT`.

        **Example:** `offer.Price.lowval=10&offer.Price.highval=100&offer.Price.operation=BT`
      schema:
        type: number
      example: 100

    # ── Product Attribute Filter Parameters ──
    ProductAttributeFilter:
      name: "product.{attribute}"
      in: query
      required: false
      description: >
        Filter offers by a **product attribute**. Prefix the attribute name with `product.`.

        **Common product attributes:**
        - `product.price=100` → filter by product price
        - `product.validity=30` → filter by product validity period

        **Sub-attribute filtering:**
        Use dot notation for sub-attributes. Example:
        - `product.benefits.datavolume=100` (where `datavolume` is a sub-attribute of `benefits`)

        **Combine with operation:**
        - `product.price=100&product.price.operation=GE` → product price ≥ 100
      schema:
        type: string
      example: "100"

    ProductAttributeOperation:
      name: "product.{attribute}.operation"
      in: query
      required: false
      description: >
        Comparison operator for `product.{attribute}` filters. Same operation values as offer filters.

        | Operation | Description |
        |-----------|-------------|
        | `EQ` | Equal to (default) |
        | `LT` | Less than |
        | `LE` | Less than or equal to |
        | `GT` | Greater than |
        | `GE` | Greater than or equal to |
        | `BT` | Between (requires lowval + highval) |
        | `ANYOF` | Match any of multiple values |
      schema:
        type: string
        enum: [EQ, LT, LE, GT, GE, BT, ANYOF]
        default: EQ
      example: "GE"

    ProductAttributeLowval:
      name: "product.{attribute}.lowval"
      in: query
      required: false
      description: Lower bound value for `BT` operation on a product attribute.
      schema:
        type: number
      example: 50

    ProductAttributeHighval:
      name: "product.{attribute}.highval"
      in: query
      required: false
      description: Upper bound value for `BT` operation on a product attribute.
      schema:
        type: number
      example: 200

  # ─────────────────────────────────────────────────────────────────────────
  # Reusable Responses
  # ─────────────────────────────────────────────────────────────────────────
  responses:

    Unauthorized:
      description: >
        **401 Authentication Failed** — The authkey is invalid, expired, or the
        request originates from a non-whitelisted IP address.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status:
              code: 401
              message: "Authentication Failed"
        application/xml:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status:
              code: 401
              message: "Authentication Failed"

    BadRequest:
      description: >
        **400 Bad Request** — The request is malformed, missing mandatory fields,
        or contains an invalid filter operation value.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status:
              code: 400
              message: "Bad Request"
        application/xml:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status:
              code: 400
              message: "Bad Request"

    NotFound:
      description: >
        **404 Invalid MSISDN / Resource Not Found** — The MSISDN is not present in
        NEON-DX, is in an invalid format (e.g., non-numeric), or the resource cannot be found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status:
              code: 404
              message: "Invalid MSISDN"
        application/xml:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status:
              code: 404
              message: "Invalid MSISDN"

    InternalServerError:
      description: >
        **500 Internal Server Error** — An unexpected error occurred on the NEON-DX server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status:
              code: 500
              message: "Internal Server Error"
        application/xml:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status:
              code: 500
              message: "Internal Server Error"

# ─────────────────────────────────────────────────────────────────────────────
# Security (Global)
# ─────────────────────────────────────────────────────────────────────────────
security:
  - BasicAuth: []

# ─────────────────────────────────────────────────────────────────────────────
# Tags
# ─────────────────────────────────────────────────────────────────────────────
tags:
  - name: Get Offers
    description: >
      Retrieve personalized, rich media offers for a customer on a specific MKT inbound touchpoint.
      Uses MSISDN or a configured identity attribute as the customer identifier.
  - name: Accept Offer
    description: >
      Notify NEON-DX that a customer has accepted an offer, triggering the
      conversion and fulfilment event chain (event id = 104).

# ─────────────────────────────────────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────────────────────────────────────
paths:

  # ════════════════════════════════════════════════════════════════════════
  # GET OFFERS v2 — by MSISDN
  # ════════════════════════════════════════════════════════════════════════
  /msisdn/{msisdn}/v2/offers:
    get:
      tags:
        - Get Offers
      summary: Get Offers v2 (by MSISDN)
      operationId: getOffersByMsisdn
      description: |
        Retrieves a ranked list of personalized, rich media offers for a customer
        identified by their **MSISDN** on a specific MKT inbound touchpoint.

        ### How It Works
        1. The channel sends a GET request with the customer's MSISDN and authkey.
        2. NEON-DX recommendation engine evaluates eligible offers for that customer.
        3. An ordered list of rich media offers is returned with creatives (text or image),
           product attributes, and action URLs.
        4. The touchpoint renders and displays the offers to the customer.

        ### Offer Attribute Filters
        Filters allow the channel to narrow returned offers:
        - **By offer attribute:** `offer.<attributeName>=<value>` (e.g., `offer.Price=90`)
        - **By product attribute:** `product.<attributeName>=<value>` (e.g., `product.price=100`)
        - **By product sub-attribute:** `product.<attr>.<subAttr>=<value>` (e.g., `product.benefits.datavolume=100`)

        ### Filter Operations
        All attribute filters support the following operations (via `<attr>.operation`):
        - `EQ` (default) — Equal to
        - `LT` — Less than
        - `LE` — Less than or equal to
        - `GT` — Greater than
        - `GE` — Greater than or equal to
        - `BT` — Between (requires `<attr>.lowval` and `<attr>.highval`)
        - `ANYOF` — Matches any of the provided values

        ### Example URLs
        ```
        # Basic call
        GET /rest/authkey/NEON_UI/msisdn/9812000012/v2/offers

        # Filter by product price
        GET /rest/authkey/NEON_UI/msisdn/9812000012/v2/offers?product.price=90

        # Filter by offer discount attribute
        GET /rest/authkey/NEON_UI/msisdn/9812000012/v2/offers?offer.discount=15

        # Filter by product sub-attribute
        GET /rest/authkey/NEON_UI/msisdn/9812000012/v2/offers?product.benefits.datavolume=100

        # Filter offers with price between 10 and 100
        GET /rest/authkey/NEON_UI/msisdn/9812000012/v2/offers?offer.Price.lowval=10&offer.Price.highval=100&offer.Price.operation=BT

        # Return any of multiple prices
        GET /rest/authkey/NEON_UI/msisdn/9812000012/v2/offers?offer.Price=90&offer.Price=100&offer.Price.operation=ANYOF

        # Limit results and suppress event archiving
        GET /rest/authkey/NEON_UI/msisdn/9812000012/v2/offers?size=3&eventArchiving=false
        ```
      parameters:
        - $ref: '#/components/parameters/MsisdnPath'
        - $ref: '#/components/parameters/CategoryQuery'
        - $ref: '#/components/parameters/SubCategoryQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/EventArchivingQuery'
        # ── Offer Attribute Filters ──────────────────────────────────────
        - name: "offer.BundleID"
          in: query
          required: false
          description: Filter by offer Bundle ID (string, exact match by default).
          schema:
            type: string
          example: "1195"
        - name: "offer.BundleID.operation"
          in: query
          required: false
          description: Comparison operation for `offer.BundleID` filter.
          schema:
            type: string
            enum: [EQ, ANYOF]
            default: EQ
        - name: "offer.category"
          in: query
          required: false
          description: Filter by offer category (string attribute).
          schema:
            type: string
          example: "Data"
        - name: "offer.category.operation"
          in: query
          required: false
          description: Comparison operation for `offer.category` filter.
          schema:
            type: string
            enum: [EQ, ANYOF]
            default: EQ
        - name: "offer.Price"
          in: query
          required: false
          description: >
            Filter by offer Price (numeric). Use `offer.Price.operation` for non-equality comparisons.
            For ANYOF, repeat this parameter: `offer.Price=90&offer.Price=100&offer.Price.operation=ANYOF`.
            For BT, use `offer.Price.lowval` and `offer.Price.highval`.
          schema:
            type: number
          example: 3000
        - name: "offer.Price.operation"
          in: query
          required: false
          description: Comparison operation for `offer.Price` filter.
          schema:
            type: string
            enum: [EQ, LT, LE, GT, GE, BT, ANYOF]
            default: EQ
          example: "GE"
        - name: "offer.Price.lowval"
          in: query
          required: false
          description: Lower bound for `offer.Price` with `operation=BT`.
          schema:
            type: number
          example: 500
        - name: "offer.Price.highval"
          in: query
          required: false
          description: Upper bound for `offer.Price` with `operation=BT`.
          schema:
            type: number
          example: 3000
        # ── Product Attribute Filters ────────────────────────────────────
        - name: "product.price"
          in: query
          required: false
          description: Filter by product price (numeric attribute). Use with `product.price.operation` for comparisons.
          schema:
            type: number
          example: 1200
        - name: "product.price.operation"
          in: query
          required: false
          description: Comparison operation for `product.price` filter.
          schema:
            type: string
            enum: [EQ, LT, LE, GT, GE, BT, ANYOF]
            default: EQ
          example: "GE"
        - name: "product.price.lowval"
          in: query
          required: false
          description: Lower bound for `product.price` with `operation=BT`.
          schema:
            type: number
          example: 100
        - name: "product.price.highval"
          in: query
          required: false
          description: Upper bound for `product.price` with `operation=BT`.
          schema:
            type: number
          example: 3000
        - name: "product.validity"
          in: query
          required: false
          description: Filter by product validity period (numeric, in days).
          schema:
            type: number
          example: 30
        - name: "product.validity.operation"
          in: query
          required: false
          description: Comparison operation for `product.validity` filter.
          schema:
            type: string
            enum: [EQ, LT, LE, GT, GE, BT, ANYOF]
            default: EQ
        - name: "product.benefits.datavolume"
          in: query
          required: false
          description: >
            Filter by the `datavolume` sub-attribute of the `benefits` product attribute.
            Example: `product.benefits.datavolume=100`
          schema:
            type: number
          example: 100
        - name: "product.benefits.datavolume.operation"
          in: query
          required: false
          description: Comparison operation for the `product.benefits.datavolume` sub-attribute filter.
          schema:
            type: string
            enum: [EQ, LT, LE, GT, GE, BT, ANYOF]
            default: EQ
      responses:
        "200":
          description: >
            **Success** — One or more offers are available for the customer.
            Returns an ordered array of personalized offers with full details.
          headers:
            Content-Type:
              description: Response format
              schema:
                type: string
                example: "application/json"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOffersSuccessResponse'
              examples:
                text_creative:
                  summary: Offers with text creatives
                  value:
                    status:
                      code: 200
                      message: "Success"
                    Offers:
                      - position: 1
                        id: 1229
                        ruleName: "ROS_Promo_Illimax_3000F_Mandatory_3_Local_Inbound_V2"
                        programId: 1009
                        programName: "NBO_Inbound_Program_Mandatory Offer"
                        offerDetails:
                          offerName: "Promo_Illimax_3000F_mandatory"
                          offerInternalId: 2065
                          offerType: "stv"
                          offerAttributes:
                            - attributeName: "Bundle ID"
                              value: "1195"
                              subAttributes: []
                            - attributeName: "Price"
                              value: "3000"
                              subAttributes: []
                          products:
                            - productName: "Promo_Illimax_3000F"
                              productId: "1135"
                              productDescription: "Promo_Illimax_3000F"
                              productAttributes:
                                - attributeName: "price"
                                  value: "3000"
                                  subAttributes: []
                                - attributeName: "validity"
                                  value: "30"
                                  subAttributes: []
                                - attributeName: "benefit"
                                  value: ""
                                  subAttributes:
                                    - name: "usage_leg"
                                      value: "Local voice"
                                    - name: "type"
                                      value: "Minutes"
                                    - name: "value"
                                      value: "\"100\""
                          creatives:
                            - language: "English (UK)"
                              isCustomerPreferred: "No"
                              isDefault: true
                              type: "text"
                              title: "3000F = 24Go+300mn-30j"
                              description: "24Go + 300mn ts reseaux valable 30j a 3000F"
                image_creative:
                  summary: Offers with rich media (image) creatives
                  value:
                    status:
                      code: 200
                      message: "Success"
                    Offers:
                      - position: 1
                        id: 1229
                        ruleName: "ROS_Promo_Illimax_3000F_Mandatory_3_Local_Inbound_V2"
                        programId: 1009
                        programName: "NBO_Inbound_Program_Mandatory Offer"
                        offerDetails:
                          offerName: "Promo_Illimax_3000F_mandatory"
                          offerInternalId: 2065
                          offerType: "stv"
                          offerAttributes:
                            - attributeName: "Bundle ID"
                              value: "1195"
                              subAttributes: []
                            - attributeName: "Price"
                              value: "3000"
                              subAttributes: []
                          products:
                            - productName: "Promo_Illimax_3000F"
                              productId: "1135"
                              productDescription: "Promo_Illimax_3000F"
                              productAttributes:
                                - attributeName: "price"
                                  value: "3000"
                                  subAttributes: []
                          creatives:
                            - language: "English (UK)"
                              isCustomerPreferred: "No"
                              isDefault: true
                              type: "image"
                              title: "3000F = 24Go+300mn-30j"
                              description: "24Go + 300mn ts reseaux valable 30j a 3000F"
                              mediaUrl: "https://www.exampleTelecom.com/images/mobileData3.jpeg"
                              actions:
                                - label: "More Info"
                                  url: "https://www.exampleTelecom.com/products/data/d87876547"
            application/xml:
              schema:
                $ref: '#/components/schemas/GetOffersSuccessResponse'
        "205":
          description: >
            **No Offers Available** — The customer has no eligible offers on this touchpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOffersNoOffersResponse'
              example:
                status:
                  code: 205
                  message: "No offers are available"
            application/xml:
              schema:
                $ref: '#/components/schemas/GetOffersNoOffersResponse'
              example:
                status:
                  code: 205
                  message: "No offers are available"
            
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # ════════════════════════════════════════════════════════════════════════
  # GET OFFERS v2 — by Identity Attribute
  # ════════════════════════════════════════════════════════════════════════
  /{identityAttributeName}/{identityAttributeValue}/v2/offers:
    get:
      tags:
        - Get Offers
      summary: Get Offers v2 (by Identity Attribute)
      operationId: getOffersByIdentityAttribute
      description: |
        Retrieves personalized offers for a customer identified by a **custom identity attribute**
        (e.g., `app_ID`) instead of MSISDN.

        This endpoint is used when the touchpoint does not have access to the customer's MSISDN
        but has a configured alternative identity attribute.

        ### Example URL
        ```
        GET /rest/authkey/tui234ghg32/app_ID/xfgt56tra7685/v2/offers
        ```

        All filter parameters are identical to the MSISDN-based endpoint.
      parameters:
        - $ref: '#/components/parameters/IdentityAttributeNamePath'
        - $ref: '#/components/parameters/IdentityAttributeValuePath'
        - $ref: '#/components/parameters/CategoryQuery'
        - $ref: '#/components/parameters/SubCategoryQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - $ref: '#/components/parameters/EventArchivingQuery'
        - name: "offer.BundleID"
          in: query
          required: false
          description: Filter by offer Bundle ID.
          schema:
            type: string
        - name: "offer.category"
          in: query
          required: false
          description: Filter by offer category.
          schema:
            type: string
        - name: "offer.Price"
          in: query
          required: false
          description: Filter by offer Price.
          schema:
            type: number
        - name: "offer.Price.operation"
          in: query
          required: false
          schema:
            type: string
            enum: [EQ, LT, LE, GT, GE, BT, ANYOF]
            default: EQ
        - name: "offer.Price.lowval"
          in: query
          required: false
          schema:
            type: number
        - name: "offer.Price.highval"
          in: query
          required: false
          schema:
            type: number
        - name: "product.price"
          in: query
          required: false
          schema:
            type: number
        - name: "product.price.operation"
          in: query
          required: false
          schema:
            type: string
            enum: [EQ, LT, LE, GT, GE, BT, ANYOF]
            default: EQ
        - name: "product.validity"
          in: query
          required: false
          schema:
            type: number
        - name: "product.benefits.datavolume"
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: Success — Offers returned for the customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOffersSuccessResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/GetOffersSuccessResponse'
        "205":
          description: No offers available for this customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOffersNoOffersResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  # ════════════════════════════════════════════════════════════════════════
  # ACCEPT OFFER — by MSISDN
  # ════════════════════════════════════════════════════════════════════════
  /msisdn/{msisdn}/kpi/events:
    post:
      tags:
        - Accept Offer
      summary: Accept Offer (Register Offer Accepted Event)
      operationId: acceptOfferByMsisdn
      description: |
        Notifies NEON-DX that a customer has **accepted an offer**, triggering the
        conversion and subsequent fulfilment event chain within the platform.

        ### How It Works
        1. The MKT channel completes the offer activation with the IN system.
        2. Upon successful activation, the channel POSTs an Accept Offer event to NEON-DX.
        3. NEON-DX records the **Offer Accepted event (id = 104)** and triggers configured
           conversion and fulfilment events.

        ### Request Body
        The request body wraps an array of event objects. For Offer Accepted, always use:
        - `id`: **"104"** (reserved event identifier for Offer Accepted)
        - `type`: Touchpoint name (e.g., `WEB`, `APP`, `IVR`, `USSD`, `CRM`)
        - `value`: `<offerId>[,<Agent>,<Remarks>]` — `offerId` from the Get Offers response
        - `date`: Timestamp in `yyyy-MM-dd HH:mm:ss Z` format

        ### Example URL
        ```
        POST http://serverIP:port/rest/authkey/NEON_UI/msisdn/9999999999/kpi/events
        ```

        ### Example Request Body
        ```json
        {
          "event": [
            {
              "id": "104",
              "type": "WEB",
              "value": "16279,AgentName,Accepted",
              "date": "2026-03-12 10:30:00 +0530"
            }
          ]
        }
        ```

        > **Note:** In-system activation (IN-side) is outside NEON-DX scope.
        > The channel handles fulfilment and then notifies NEON-DX via this API.
      parameters:
        - $ref: '#/components/parameters/MsisdnPath'
      requestBody:
        required: true
        description: >
          Accept Offer event payload. Must contain the `event` array with at least one
          Offer Accepted event (id = 104).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptOfferRequest'
            examples:
              web_channel:
                summary: WEB channel acceptance
                value:
                  event:
                    - id: "104"
                      type: "WEB"
                      value: "16279,AgentName,Accepted"
                      date: "2026-03-12 10:30:00 +0530"
              app_channel:
                summary: APP channel acceptance (no agent)
                value:
                  event:
                    - id: "104"
                      type: "APP"
                      value: "1229"
                      date: "2026-03-12 10:30:00 +0530"
              crm_channel:
                summary: CRM channel acceptance with agent and remarks
                value:
                  event:
                    - id: "104"
                      type: "CRM"
                      value: "1214,JohnDoe,Customer requested upgrade"
                      date: "2026-03-12 14:45:00 +0530"
          application/xml:
            schema:
              $ref: '#/components/schemas/AcceptOfferRequest'
      responses:
        "200":
          description: >
            **Success** — The Offer Accepted event has been recorded in NEON-DX.
            Conversion and fulfilment events have been triggered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/StatusObject'
              example:
                status:
                  code: 200
                  message: "Success"
            application/xml:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/StatusObject'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "499":
          description: >
            **499 Failed** — The event was received but processing failed on the NEON-DX side.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status:
                  code: 499
                  message: "Failed"
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status:
                  code: 499
                  message: "Failed"
        "500":
          $ref: '#/components/responses/InternalServerError'
